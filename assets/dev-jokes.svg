    <text x="479" y="47" fill="#F0BC66" font-family="monospace" font-size="11" letter-spacing="1">DAILY ROUTINE</text>
    <text x="433" y="91" fill="#E4EFFC" font-family="sans-serif" font-size="21" font-weight="700">Eat. Sleep. Debug. Repeat.</text>
    <text x="433" y="122" fill="#91A9C7" font-family="sans-serif" font-size="15">Somewhere in there: remember to eat.</text>
