    <text x="832" y="91" fill="#E4EFFC" font-family="sans-serif" font-size="21" font-weight="700">It’s not a bug. It’s z-index.</text>
    <text x="832" y="122" fill="#91A9C7" font-family="sans-serif" font-size="15">Until it meets another z-index.</text>
