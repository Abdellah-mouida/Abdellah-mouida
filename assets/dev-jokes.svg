    <text x="80" y="47" fill="#77B6FF" font-family="monospace" font-size="11" letter-spacing="1">THE CLASSIC</text>
    <text x="34" y="91" fill="#E4EFFC" font-family="sans-serif" font-size="21" font-weight="700">“Works on my machine.”</text>
