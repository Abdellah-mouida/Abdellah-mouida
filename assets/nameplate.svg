<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="170" viewBox="0 0 1000 170" role="img" aria-labelledby="title desc">
<title id="title">Abdellah Mouida</title>
<desc id="desc">A polished electric-blue and silver nameplate for Abdellah Mouida.</desc>
<defs>
  <linearGradient id="name" x1="190" y1="40" x2="810" y2="116" gradientUnits="userSpaceOnUse">
    <stop stop-color="#EAF4FF"/>
    <stop offset=".42" stop-color="#B6D9FF"/>
    <stop offset=".72" stop-color="#69AEFF"/>
    <stop offset="1" stop-color="#E6F3FF"/>
  </linearGradient>
  <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#68A9FF" stop-opacity="0"/>
    <stop offset=".48" stop-color="#C7E4FF" stop-opacity=".95"/>
    <stop offset="1" stop-color="#68A9FF" stop-opacity="0"/>
  </linearGradient>
  <filter id="softGlow" x="-30%" y="-80%" width="160%" height="260%">
    <feGaussianBlur stdDeviation="8"/>
  </filter>
</defs>
<ellipse cx="500" cy="83" rx="310" ry="45" fill="#287BE8" opacity=".13" filter="url(#softGlow)"/>
<text x="500" y="91" text-anchor="middle" fill="url(#name)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="66" font-weight="750" letter-spacing="1.5">Abdellah Mouida</text>
<text x="500" y="126" text-anchor="middle" fill="#8DAACB" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="5">DEVELOPER · BUILDER · LIFELONG LEARNER</text>
<path d="M235 145H765" stroke="#294B73" stroke-width="1"/>
<path d="M235 145H765" stroke="url(#beam)" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="90 440">
  <animate attributeName="stroke-dashoffset" from="530" to="-530" dur="5.5s" repeatCount="indefinite"/>
</path>
<circle cx="220" cy="145" r="2.5" fill="#68A9FF"/>
<circle cx="780" cy="145" r="2.5" fill="#68A9FF"/>
<circle cx="500" cy="145" r="3" fill="#C9E4FF">
  <animate attributeName="r" values="2.5;4;2.5" dur="2.4s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values=".65;1;.65" dur="2.4s" repeatCount="indefinite"/>
</circle>
</svg>